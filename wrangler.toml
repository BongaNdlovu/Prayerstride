name = "prayerstride"
main = "worker/index.js"
compatibility_date = "2026-05-15"

[vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "end-of-time-94cd3"
FIREBASE_STORAGE_BUCKET = "end-of-time-94cd3.firebasestorage.app"
CORS_ORIGIN = "https://api.prayerstride.app"
API_PUBLIC_URL = "https://api.prayerstride.app"

[triggers]
crons = ["0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "prayerstride-db"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "prayerstride-avatars"

[durable_objects]
bindings = [
  { name = "USER_NOTIFICATION_STREAM", class_name = "UserNotificationStream" },
  { name = "ADMIN_EVENT_STREAM", class_name = "AdminEventStream" },
]

[[migrations]]
tag = "v1"
new_classes = ["UserNotificationStream", "AdminEventStream"]

[env.development]
vars = { ENVIRONMENT = "development", API_PUBLIC_URL = "http://127.0.0.1:8787", CORS_ORIGIN = "http://127.0.0.1:8787", ALLOW_DEV_ORIGINS = "true", FIREBASE_PROJECT_ID = "end-of-time-94cd3", FIREBASE_STORAGE_BUCKET = "end-of-time-94cd3.firebasestorage.app" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "prayerstride-db-dev"
database_id = "b226ff43-4b12-4c96-b46d-a527dcc18bca"
migrations_dir = "migrations"

[[env.development.r2_buckets]]
binding = "AVATARS"
bucket_name = "prayerstride-avatars-dev"

[env.development.durable_objects]
bindings = [
  { name = "USER_NOTIFICATION_STREAM", class_name = "UserNotificationStream" },
  { name = "ADMIN_EVENT_STREAM", class_name = "AdminEventStream" },
]

[env.staging]
vars = { ENVIRONMENT = "staging", API_PUBLIC_URL = "https://api-staging.prayerstride.app", CORS_ORIGIN = "https://api-staging.prayerstride.app" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "prayerstride-db-staging"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "AVATARS"
bucket_name = "prayerstride-avatars-staging"

[env.staging.durable_objects]
bindings = [
  { name = "USER_NOTIFICATION_STREAM", class_name = "UserNotificationStream" },
  { name = "ADMIN_EVENT_STREAM", class_name = "AdminEventStream" },
]

[env.production]
vars = { ENVIRONMENT = "production", API_PUBLIC_URL = "https://api.prayerstride.app", CORS_ORIGIN = "https://api.prayerstride.app" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "prayerstride-db"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "AVATARS"
bucket_name = "prayerstride-avatars"

[env.production.durable_objects]
bindings = [
  { name = "USER_NOTIFICATION_STREAM", class_name = "UserNotificationStream" },
  { name = "ADMIN_EVENT_STREAM", class_name = "AdminEventStream" },
]
