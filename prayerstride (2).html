<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrayerStride</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { serif: ['Georgia','Cambria','Times New Roman','serif'] },
      colors: { navy:'#082A4A', gold:'#C8892B', ivory:'#F8F3EA', stone:'#E7DFD2', ink:'#101820', sand:'#fbf7ef' }
    }
  }
}
</script>
<style>
.line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
body { background: #F8F3EA; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
@keyframes fi { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.ani { animation: fi 0.35s ease-out; }
/* Custom scrollbar for webkit */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d8cec0; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
const lucide={};
function mk(n,ps){lucide[n]=({size=24,className="",strokeWidth=2,...p})=>React.createElement('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth,strokeLinecap:'round',strokeLinejoin:'round',className,...p},ps.map((d,i)=>React.createElement('path',{d,key:i})));}
mk('ArrowLeft',['M19 12H5','M12 19l-7-7 7-7']);mk('Bell',['M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9','M13.73 21a2 2 0 0 1-3.46 0']);
mk('BookOpen',['M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z','M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z']);mk('Bookmark',['m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z']);
mk('CalendarDays',['M8 2v4','M16 2v4','M3 10h18','M8 14h.01','M12 14h.01','M16 14h.01','M8 18h.01','M12 18h.01','M16 18h.01','M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2']);
mk('CheckCircle2',['M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z','m9 12 2 2 4-4']);mk('ChevronRight',['M9 18l6-6-6-6']);
mk('Clock',['M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z','M12 6v6l4 2']);mk('Flame',['M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z']);
mk('Heart',['M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z']);mk('Home',['M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z','M9 22V12h6v10']);
mk('Leaf',['M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.5 2 8 0 5.5-4.8 10-10 10Z','M2 21c0-3 1.5-5 5-5 1 0 2 .5 2 2 0 2-1 3-3 3s-3-1.5-3-3.5Z']);mk('Mail',['m22 7-8.991 5.719a2 2 0 0 1-2.009 0L2 7','M22 4H2v16h20V4z']);
mk('MoreHorizontal',['M17 12h.01','M12 12h.01','M7 12h.01']);mk('Plus',['M12 5v14','M5 12h14']);mk('Search',['m21 21-4.34-4.34','M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z']);
mk('Send',['M22 2L11 13','M22 2l-7 20-4-9-9-4 20-7z']);mk('Settings',['M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z']);
mk('ShieldCheck',['M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z','M9 12l2 2 4-4']);mk('User',['M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2','M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z']);
mk('Users',['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2','M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z','M22 21v-2a4 4 0 0 0-3-3.87','M16 3.13a4 4 0 0 1 0 7.75']);
</script>
<script type="text/babel">
const {useMemo,useState}=React;
const {ArrowLeft,Bell,BookOpen,Bookmark,CalendarDays,CheckCircle2,ChevronRight,Clock,Flame,Heart,Home,Leaf,Mail,MoreHorizontal,Plus,Search,Send,Settings,ShieldCheck,User,Users}=lucide;
const prayers=[{name:"Sarah M.",title:"Pray for peace in our home",text:"We've been walking through a hard season with tension and worry. Please pray for unity and healing in our family.",count:35,tag:"Family"},{name:"Anonymous",title:"Recovery after surgery",text:"Please pray for complete healing, strength, and peace during recovery.",count:24,tag:"Healing"}];
const NAV_TO_SCREEN={home:"home",pray:"discover",create:"create",praise:"praise",profile:"profile"};

function PrayingHandsIcon({size=24,className="",strokeWidth=1.8}){
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" className={className} aria-hidden="true">
    <path d="M9.2 3.4c1.1 1.8 1.65 3.55 1.65 5.25v8.1c0 1.35-.72 2.6-1.9 3.28l-1.05.6" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M14.8 3.4c-1.1 1.8-1.65 3.55-1.65 5.25v8.1c0 1.35.72 2.6 1.9 3.28l1.05.6" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M8.6 7.9 5.9 12c-.5.76-.6 1.72-.28 2.56l1.55 4.02" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M15.4 7.9 18.1 12c.5.76.6 1.72.28 2.56l-1.55 4.02" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M10.9 9.2 9.3 11.9M13.1 9.2l1.6 2.7" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round"/>
  </svg>;
}

function PhoneFrame({children}){
  return (
    <div className="relative mx-auto h-[720px] w-[350px] rounded-[42px] border-[10px] border-[#101014] bg-[#fbf7ef] shadow-2xl overflow-hidden">
      <div className="absolute left-1/2 top-2 z-50 h-7 w-28 -translate-x-1/2 rounded-full bg-[#09090b]"/>
      <div className="absolute inset-x-0 top-0 z-40 flex h-12 items-center justify-between px-7 pt-2 text-[11px] font-semibold text-slate-900 pointer-events-none">
        <span>9:41</span><span className="tracking-tight">▮▮ ◡ ●</span>
      </div>
      <div className="h-full pt-12 overflow-y-auto">{children}</div>
      <div className="absolute bottom-2 left-1/2 h-1.5 w-28 -translate-x-1/2 rounded-full bg-black/80 pointer-events-none"/>
    </div>
  );
}

function TopLogo({small=false}){
  return <div className="flex flex-col items-center gap-1 text-center">
    <div className="relative text-navy"><PrayingHandsIcon size={small?30:44} strokeWidth={1.5}/><span className="absolute -right-2 -top-3 text-gold">✦</span></div>
    <div className={`${small?"text-2xl":"text-4xl"} font-serif text-navy`}>PrayerStride</div>
    <div className="text-xs text-slate-600">A daily walk in prayer</div>
  </div>;
}

function BottomNav({active,onNavigate}){
  const items=[["home",Home,"Home"],["pray",PrayingHandsIcon,"Pray"],["create",Plus,"Create"],["praise",Heart,"Praise"],["profile",User,"Profile"]];
  return <div className="sticky bottom-0 left-0 right-0 z-30 border-t border-[#e8dfd1] bg-[#fbf7ef]/95 px-5 pt-2 backdrop-blur">
    <div className="grid grid-cols-5 items-center text-[10px] text-slate-500">
      {items.map(([key,Icon,label])=>{
        const selected=active===key;
        return <button key={key} onClick={()=>onNavigate(key)} className="flex flex-col items-center gap-1 py-1">
          <div className={`${key==="create"?"-mt-7 flex h-12 w-12 items-center justify-center rounded-full bg-navy text-white shadow-lg":selected?"text-navy":"text-slate-500"}`}>
            <Icon size={key==="create"?23:20} strokeWidth={selected||key==="create"?2.4:1.8}/>
          </div>
          <span className={`${selected?"font-semibold text-navy":""}`}>{label}</span>
        </button>;
      })}
    </div>
  </div>;
}

function PrayerCard({prayer,onPress}){
  return <button onClick={onPress} className="w-full rounded-2xl border border-[#e6ddcf] bg-white/80 p-4 text-left shadow-sm transition active:scale-[0.98]">
    <div className="flex items-center justify-between text-xs text-slate-500"><span>{prayer.name} · 2h ago</span><span className="rounded-full bg-[#f2e7d6] px-2 py-1 text-navy">{prayer.tag}</span></div>
    <h4 className="mt-2 font-serif text-xl leading-tight text-slate-950">{prayer.title}</h4>
    <p className="mt-2 line-clamp-3 text-sm leading-5 text-slate-600">{prayer.text}</p>
    <div className="mt-3 flex items-center justify-between text-xs text-slate-500"><span className="flex items-center gap-1"><Users size={14}/> {prayer.count} praying</span><Bookmark size={16}/></div>
  </button>;
}

function Splash({onEnter}){
  return <div className="relative flex h-full flex-col justify-between overflow-hidden bg-[#f8f3ea] px-8 pb-14 text-center ani">
    <div className="absolute inset-0 opacity-80">
      <div className="absolute inset-x-0 bottom-0 h-[430px] bg-[radial-gradient(circle_at_50%_18%,rgba(200,137,43,0.34),transparent_18%),linear-gradient(to_top,rgba(8,42,74,0.78),rgba(8,42,74,0.18),transparent)]"/>
      <div className="absolute bottom-0 h-80 w-full bg-[linear-gradient(135deg,transparent_20%,rgba(8,42,74,0.35)_20%,rgba(8,42,74,0.35)_30%,transparent_30%),linear-gradient(45deg,transparent_35%,rgba(8,42,74,0.28)_35%,rgba(8,42,74,0.28)_45%,transparent_45%)] blur-sm"/>
    </div>
    <div className="relative mt-24 flex-1 pt-10"><TopLogo/></div>
    <div className="relative space-y-6">
      <p className="mx-auto max-w-[230px] text-lg font-serif leading-snug text-white drop-shadow">Prayer changes things.<br/>You're never alone.</p>
      <button onClick={onEnter} className="w-full rounded-2xl bg-navy px-5 py-4 font-semibold text-white shadow-lg shadow-navy/25 transition hover:bg-[#0a3358]">Enter PrayerStride</button>
    </div>
  </div>;
}

function Welcome({onContinue}){
  return <div className="flex h-full flex-col bg-sand px-6 pb-8 ani">
    <div className="mt-8"><TopLogo small/></div>
    <div className="mt-10 h-44 rounded-[28px] bg-[radial-gradient(circle_at_55%_20%,rgba(200,137,43,0.28),transparent_18%),linear-gradient(180deg,#efe4d5,#d8d1c5)] p-5"/>
    <h1 className="mt-8 font-serif text-4xl leading-tight text-navy">Welcome to<br/>PrayerStride</h1>
    <p className="mt-3 text-sm leading-6 text-slate-600">Build a daily prayer habit, pray for others, and celebrate answered prayers together.</p>
    <div className="mt-6 space-y-3">
      {[[CalendarDays,"Daily Habit","Grow closer to God with consistent prayer."],[Users,"Pray for Others","Lift up real people and real needs."],[Heart,"Celebrate Answers","Share testimonies of God's faithfulness."]].map(([Icon,title,text])=>
        <div key={title} className="flex items-center gap-4 rounded-2xl border border-[#e6ddcf] bg-white/70 p-4 shadow-sm"><Icon className="text-navy" size={23}/><div><div className="font-semibold text-slate-900">{title}</div><div className="text-xs text-slate-500">{text}</div></div></div>
      )}
    </div>
    <button onClick={onContinue} className="mt-auto rounded-2xl bg-navy py-4 font-semibold text-white transition hover:bg-[#0a3358]">Continue</button>
  </div>;
}

function ReminderSetup({onBack,onContinue}){
  const [rems,setRems]=useState([{title:"Morning Prayer",text:"Start your day with God.",time:"7:00 AM",selected:true},{title:"Evening Prayer",text:"End your day in peace.",time:"8:00 PM",selected:false}]);
  const toggle=(i)=>{const n=[...rems];n[i].selected=!n[i].selected;setRems(n);};
  return <div className="flex h-full flex-col bg-sand px-6 pb-8 ani">
    <button onClick={onBack} className="mt-3 w-fit text-navy"><ArrowLeft size={22}/></button>
    <div className="mt-6 rounded-[30px] bg-[radial-gradient(circle_at_50%_45%,rgba(200,137,43,.35),transparent_14%),linear-gradient(180deg,#efe6d8,#fbf7ef)] p-8 text-center"><div className="mx-auto h-20 w-20 rounded-full bg-[#f1dfc8]"/></div>
    <h1 className="mt-7 font-serif text-3xl leading-tight text-navy">When would you like<br/>to be reminded?</h1>
    <p className="mt-2 text-sm leading-6 text-slate-600">We'll send a gentle nudge so you never miss a moment to pray.</p>
    <div className="mt-6 space-y-3">
      {rems.map((r,i)=><button key={r.title} onClick={()=>toggle(i)} className="flex w-full items-center justify-between rounded-2xl border border-[#e6ddcf] bg-white/70 p-4 text-left transition active:scale-[0.98]">
        <div className="flex items-center gap-3"><div className="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3e6d2] text-gold"><Clock size={20}/></div>
        <div><div className="font-semibold text-slate-900">{r.title}</div><div className="text-xs text-slate-500">{r.text}</div><span className="mt-1 inline-block rounded-full border px-2 py-0.5 text-xs">{r.time}</span></div></div>
        <div className={`h-5 w-5 rounded-full border ${r.selected?"border-navy bg-navy ring-4 ring-[#d8e4ee]":"border-slate-300"}`}/>
      </button>)}
    </div>
    <button onClick={onContinue} className="mt-auto rounded-2xl bg-navy py-4 font-semibold text-white transition hover:bg-[#0a3358]">Continue</button>
  </div>;
}

function HomeScreen({onNavigate,onGo,activeTab}){
  return <div className="min-h-full bg-sand pb-5 ani">
    <div className="relative h-56 bg-[radial-gradient(circle_at_75%_40%,rgba(200,137,43,.36),transparent_15%),linear-gradient(180deg,#f4eadb,#ddd6ca)] px-6 pt-5">
      <div className="flex items-center justify-between"><div><h1 className="font-serif text-3xl text-navy">PrayerStride</h1><p className="text-xs text-slate-600">A daily walk in prayer</p></div><div className="flex gap-3 text-navy"><Bell size={21}/><Search size={21}/></div></div>
    </div>
    <div className="-mt-16 px-5">
      <div className="rounded-[28px] border border-[#e6ddcf] bg-white/90 p-5 shadow-xl shadow-slate-900/5">
        <div className="flex items-center justify-between"><div><p className="text-xs font-semibold uppercase tracking-widest text-gold">Today's Prayer Mission</p><h2 className="mt-2 font-serif text-2xl text-navy">Pray for peace in our home</h2></div><div className="flex h-14 w-14 items-center justify-center rounded-full bg-navy text-white"><PrayingHandsIcon size={25}/></div></div>
        <p className="mt-3 text-sm leading-6 text-slate-600">A family has asked for prayer during a difficult season. Take two quiet minutes and lift them up.</p>
        <button onClick={()=>onGo("detail")} className="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-navy py-3.5 font-semibold text-white transition hover:bg-[#0a3358]">Pray Now <ChevronRight size={18}/></button>
      </div>
      <div className="mt-4 grid grid-cols-2 gap-3">
        <div className="rounded-2xl border border-[#e6ddcf] bg-white/75 p-4"><Flame className="text-gold"/><div className="mt-2 text-2xl font-serif text-navy">7 days</div><p className="text-xs text-slate-500">walking with God</p></div>
        <div className="rounded-2xl border border-[#e6ddcf] bg-white/75 p-4"><Heart className="text-gold"/><div className="mt-2 text-2xl font-serif text-navy">2</div><p className="text-xs text-slate-500">answered prayers this week</p></div>
      </div>
      <div className="mt-6 flex items-center justify-between"><h3 className="font-serif text-xl text-navy">Prayer Requests</h3><button onClick={()=>onGo("discover")} className="text-xs font-semibold text-navy">View all</button></div>
      <div className="mt-3 space-y-3">{prayers.map((p)=><PrayerCard key={p.title} prayer={p} onPress={()=>onGo("detail")}/>)}</div>
    </div>
    <BottomNav active={activeTab} onNavigate={onNavigate}/>
  </div>;
}

function Discover({onGo,activeTab,onNavigate}){
  return <div className="min-h-full bg-sand pb-5 ani">
    <div className="mt-4 flex items-center justify-between px-5"><h1 className="font-serif text-3xl text-navy">Discover</h1><button onClick={()=>onGo("home")} className="text-slate-700"><ArrowLeft size={22}/></button></div>
    <div className="mt-5 mx-5 flex items-center gap-2 rounded-2xl border bg-white/80 px-3 py-3"><Search size={18} className="text-slate-400"/><span className="text-sm text-slate-400">Search prayers, people, testimonies...</span></div>
    <div className="mt-4 px-5 flex gap-2">{["Prayers","People","Testimonies"].map((t,i)=><span key={t} className={`rounded-full px-4 py-2 text-xs font-semibold ${i===0?"bg-navy text-white":"bg-white text-slate-600"}`}>{t}</span>)}</div>
    <h2 className="mt-6 px-5 font-serif text-xl text-navy">Top Prayer Requests</h2>
    <div className="mt-3 px-5 space-y-3">{[...prayers,{name:"Grace L.",title:"College finals",text:"Please pray for focus, peace, and wisdom during exams.",count:31,tag:"Guidance"}].map((p)=><PrayerCard key={p.title} prayer={p} onPress={()=>onGo("detail")}/>)}</div>
    <h2 className="mt-6 px-5 font-serif text-xl text-navy">People</h2>
    <div className="mt-3 px-5 space-y-2">{["Matt Brown","Olivia Carter","James Lee"].map((name)=><div key={name} className="flex items-center justify-between rounded-2xl border bg-white/75 p-3"><div className="flex items-center gap-3"><div className="h-10 w-10 rounded-full bg-[#ded3c4]"/><div><div className="font-semibold text-slate-800">{name}</div><div className="text-xs text-slate-500">Praying with community</div></div></div><button className="flex h-9 w-9 items-center justify-center rounded-full bg-navy text-white transition hover:bg-[#0a3358]"><Plus size={18}/></button></div>)}</div>
    <BottomNav active={activeTab} onNavigate={onNavigate}/>
  </div>;
}

function Detail({onGo,activeTab,onNavigate}){
  const [prayed,setPrayed]=useState(false);
  return <div className="min-h-full bg-sand pb-5 ani">
    <div className="h-52 bg-[radial-gradient(circle_at_50%_50%,rgba(200,137,43,.32),transparent_18%),linear-gradient(180deg,#efe3d2,#fbf7ef)] px-5 pt-4">
      <div className="flex items-center justify-between"><button onClick={()=>onGo("home")} className="text-slate-700"><ArrowLeft size={22}/></button><MoreHorizontal size={23} className="text-slate-700"/></div>
    </div>
    <div className="-mt-16 px-5">
      <div className="rounded-[28px] border border-[#e6ddcf] bg-white/95 p-5 shadow-xl shadow-slate-900/5">
        <div className="flex items-center gap-3"><div className="h-11 w-11 rounded-full bg-[#ded3c4]"/><div><div className="font-semibold text-slate-900">Sarah M.</div><div className="text-xs text-slate-500">Prayer Request · 2h ago</div></div></div>
        <h1 className="mt-5 font-serif text-3xl leading-tight text-navy">Pray for peace in our home</h1>
        <p className="mt-4 text-[15px] leading-7 text-slate-700">We've been walking through a really hard season with tension and worry. Please pray for unity and healing in our family. Thank you.</p>
        <div className="mt-5 flex items-center justify-between border-t border-b border-[#eee4d8] py-3 text-sm text-slate-500"><span className="flex items-center gap-2"><Users size={17}/> 35 praying</span><span className="flex items-center gap-2"><Send size={16}/> Share</span></div>
        {prayed&&<div className="mt-4 rounded-2xl bg-[#e8f0f6] p-4 text-navy"><div className="flex items-center gap-2 font-semibold"><CheckCircle2 size={22}/> You prayed for this request</div><p className="mt-1 text-xs">Thank you for standing with Sarah today.</p></div>}
        <h3 className="mt-5 font-serif text-xl text-navy">Encouragements</h3>
        <div className="mt-3 space-y-3">{["I'm lifting you up. Praying for God's peace to guard your hearts this week.","Praying with you. May God bring comfort and unity."].map((text,i)=><div key={i} className="rounded-2xl bg-sand p-3"><div className="text-xs font-semibold text-slate-700">{i?"Olivia C.":"James L."} · {i+1}h ago</div><p className="mt-1 text-sm leading-5 text-slate-600">{text}</p></div>)}</div>
      </div>
    </div>
    <div className="mt-6 px-5 flex gap-3">
      <button onClick={()=>setPrayed(true)} className="flex-1 rounded-2xl bg-navy py-4 font-semibold text-white transition hover:bg-[#0a3358]">{prayed?"Pray Again":"I'll Pray"}</button>
      <button className="w-14 rounded-2xl border bg-white transition active:scale-95"><Bookmark className="mx-auto text-navy" size={20}/></button>
    </div>
    <BottomNav active={activeTab} onNavigate={onNavigate}/>
  </div>;
}

function Create({onGo,activeTab,onNavigate}){
  return <div className="min-h-full bg-sand pb-5 ani">
    <div className="mt-4 px-5 flex items-center justify-between"><button onClick={()=>onGo("home")} className="text-sm text-slate-700">Cancel</button><h1 className="font-semibold text-slate-900">Create Request</h1><button className="text-sm font-semibold text-navy">Post</button></div>
    <h2 className="mt-10 px-5 font-serif text-3xl leading-tight text-navy">What do you need<br/>prayer for?</h2>
    <p className="mt-3 px-5 text-sm leading-6 text-slate-500">Share as much or as little as you're comfortable with.</p>
    <div className="px-5"><textarea className="mt-7 h-40 w-full resize-none rounded-2xl border border-[#e6ddcf] bg-white/80 p-4 text-sm outline-none focus:border-navy" placeholder="Write your request..."/></div>
    <div className="mt-3 px-5 flex items-center justify-between text-xs text-slate-400"><div className="flex gap-4"><BookOpen size={18}/><Mail size={18}/><ShieldCheck size={18}/></div><span>0/1500</span></div>
    <div className="mt-6 px-5 space-y-3">
      {[["Privacy","Community",false],["Urgency","Mark as time-sensitive",true],["Anonymous","Hide my name",false],["Allow others to share","Yes, others can share this request",true]].map(([title,text,on])=>
        <div key={title} className="flex items-center justify-between rounded-2xl border bg-white/75 p-4"><div><div className="font-semibold text-slate-900">{title}</div><div className="text-xs text-slate-500">{text}</div></div><div className={`h-7 w-12 rounded-full p-1 ${on?"bg-navy":"bg-slate-200"}`}><div className={`h-5 w-5 rounded-full bg-white transition ${on?"ml-5":""}`}/></div></div>
      )}
    </div>
    <p className="mt-6 text-center text-xs text-slate-400">By posting, you agree to our community guidelines.</p>
    <BottomNav active={activeTab} onNavigate={onNavigate}/>
  </div>;
}

function Praise({activeTab,onNavigate}){
  return <div className="min-h-full bg-sand pb-5 ani">
    <h1 className="mt-4 px-5 font-serif text-3xl text-navy">Testimonies</h1>
    <div className="mt-5 mx-5 rounded-[28px] border border-[#e6ddcf] bg-white/90 p-5 shadow-sm">
      <div className="text-xs font-semibold uppercase tracking-wider text-gold">Featured Testimony</div>
      <h2 className="mt-2 font-serif text-2xl text-navy">God provided every step</h2>
      <p className="mt-2 text-sm leading-6 text-slate-600">After weeks of prayer, God opened a door at the right time. I'm grateful for His faithfulness.</p>
      <div className="mt-4 flex gap-2">
        <button className="rounded-full border px-4 py-2 text-xs font-semibold text-navy transition hover:bg-navy hover:text-white">Praise God · 128</button>
        <button className="rounded-full border px-4 py-2 text-xs font-semibold text-navy transition hover:bg-navy hover:text-white">Amen · 76</button>
      </div>
    </div>
    <h2 className="mt-6 px-5 font-serif text-xl text-navy">Recent Praise</h2>
    <div className="mt-3 px-5 space-y-3">{["Healing for Mom","New Job Opportunity","Restored Relationship"].map((title,i)=><div key={title} className="rounded-2xl border bg-white/75 p-4"><div className="text-xs text-slate-500">Praise Report · {i+1}d ago</div><h3 className="mt-1 font-serif text-xl text-slate-950">{title}</h3><p className="mt-1 text-sm leading-5 text-slate-600">God answered in a way we did not expect. Thank you for praying.</p><div className="mt-3 flex items-center gap-5 text-xs text-slate-500"><span>❤ {45-i*7}</span><span>💬 {6-i}</span></div></div>)}</div>
    <BottomNav active={activeTab} onNavigate={onNavigate}/>
  </div>;
}

function Profile({activeTab,onNavigate}){
  return <div className="min-h-full bg-sand pb-5 ani">
    <div className="mt-4 px-5 flex items-center justify-between"><h1 className="font-serif text-3xl text-navy">Profile</h1><Settings size={22} className="text-navy"/></div>
    <div className="mt-6 mx-5 rounded-[28px] border bg-white/85 p-5 text-center shadow-sm">
      <div className="mx-auto h-24 w-24 rounded-full bg-[#ded3c4]"/>
      <h2 className="mt-4 font-serif text-2xl text-navy">Bonga</h2>
      <p className="mt-1 text-xs text-slate-500">Seeker. Believer. Intercessor.</p>
      <div className="mt-5 grid grid-cols-3 gap-2">{[[128,"Prayers"],[47,"Answered"],[7,"Streak"]].map(([n,l])=><div key={l} className="rounded-2xl bg-sand p-3"><div className="font-serif text-2xl text-navy">{n}</div><div className="text-xs text-slate-500">{l}</div></div>)}</div>
    </div>
    <div className="mt-5 px-5 space-y-3">{[[PrayingHandsIcon,"My Prayers"],[Heart,"Answered Prayers"],[Bell,"Notifications"],[ShieldCheck,"Privacy"],[BookOpen,"Help & Support"]].map(([Icon,label])=>
      <button key={label} className="flex w-full items-center justify-between rounded-2xl border bg-white/75 p-4 transition active:scale-[0.98]"><span className="flex items-center gap-3 font-semibold text-slate-800"><Icon size={19} className="text-navy"/>{label}</span><ChevronRight size={18} className="text-slate-400"/></button>
    )}</div>
    <BottomNav active={activeTab} onNavigate={onNavigate}/>
  </div>;
}

function App(){
  const [onboarded,setOnboarded]=useState(false);
  const [screen,setScreen]=useState("splash");
  const [active,setActive]=useState("home");
  function go(next){setScreen(next);if(next==="home")setActive("home");if(next==="discover")setActive("pray");if(next==="create")setActive("create");if(next==="praise")setActive("praise");if(next==="profile")setActive("profile");}
  function handleNav(next){setActive(next);setScreen(NAV_TO_SCREEN[next]||"home");}
  const content=useMemo(()=>{
    const setNav=handleNav;
    if(!onboarded||screen==="splash")return <Splash onEnter={()=>{setOnboarded(true);setScreen("welcome");}}/>;
    if(screen==="welcome")return <Welcome onContinue={()=>go("reminders")}/>;
    if(screen==="reminders")return <ReminderSetup onBack={()=>go("welcome")} onContinue={()=>go("home")}/>;
    if(screen==="home")return <HomeScreen onNavigate={setNav} onGo={go} activeTab={active}/>;
    if(screen==="discover")return <Discover onGo={go} activeTab={active} onNavigate={setNav}/>;
    if(screen==="detail")return <Detail onGo={go} activeTab={active} onNavigate={setNav}/>;
    if(screen==="create")return <Create onGo={go} activeTab={active} onNavigate={setNav}/>;
    if(screen==="praise")return <Praise activeTab={active} onNavigate={setNav}/>;
    if(screen==="profile")return <Profile activeTab={active} onNavigate={setNav}/>;
    return <HomeScreen onNavigate={setNav} onGo={go} activeTab={active}/>;
  },[onboarded,screen,active]);
  return <PhoneFrame>{content}</PhoneFrame>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
